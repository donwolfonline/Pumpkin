version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pumpkin-postgres
    environment:
      POSTGRES_DB: pumpkin_dev
      POSTGRES_USER: pumpkin
      POSTGRES_PASSWORD: pumpkin_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumpkin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pumpkin-network

  redis:
    image: redis:7-alpine
    container_name: pumpkin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pumpkin-network

  maildev:
    image: maildev/maildev
    container_name: pumpkin-maildev
    ports:
      - "1080:1080"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - pumpkin-network

volumes:
  postgres_data:
  redis_data:

networks:
  pumpkin-network:
    driver: bridge
